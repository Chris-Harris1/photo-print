[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photoprint"
version = "0.1.0"
description = "Simple crop-adjust-print app for the Canon PRO-100 with ICC colour management"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "numpy>=2",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
photoprint = "photoprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
